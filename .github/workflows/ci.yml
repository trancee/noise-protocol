name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  GRADLE_VERSION: "9.4.0"
  XCODE_VERSION: "16.4"

jobs:
  version-gate:
    name: Version gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify VERSION file is valid semver
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION file must contain a valid semver (got '${version}')"
            exit 1
          fi
          echo "VERSION=${version}"

  android-tests:
    name: Android tests
    runs-on: ubuntu-24.04
    needs:
      - version-gate
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Run tests
        working-directory: android
        run: gradle --no-daemon --console=plain :lib:test

  ios-tests:
    name: iOS Swift package tests
    runs-on: macos-15
    needs:
      - version-gate
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
      - name: Run Swift package tests
        working-directory: ios
        run: swift test
