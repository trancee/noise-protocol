name: Noise Spec Watch

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream-noise-spec:
    name: Verify upstream Noise spec baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test Noise spec verifier
        run: bash ./scripts/test-verify-noise-spec-upstream.sh
      - name: Verify tracked Noise spec baseline
        run: bash ./scripts/verify-noise-spec-upstream.sh